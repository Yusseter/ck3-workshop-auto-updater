name: Build Windows installer

on:
  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/build-windows-installer.yml"
      - "installer/**"
      - "src/**"
      - "VERSION"

permissions:
  contents: read

jobs:
  build-installer:
    name: Build installer
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath "VERSION" -Raw).Trim()

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "VERSION must use semantic version format: $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "APP_VERSION=$version" >> $env:GITHUB_ENV

          Write-Host "Project version: $version"

      - name: Locate Inno Setup compiler
        shell: pwsh
        run: |
          $candidates = @()

          $command = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1

          if ($command) {
              $candidates += [string] $command.Source
          }

          $candidates += @(
              "C:\Program Files (x86)\Inno Setup 7\ISCC.exe"
              "C:\Program Files\Inno Setup 7\ISCC.exe"
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
              "C:\Program Files\Inno Setup 6\ISCC.exe"
          )

          $iscc = $candidates |
              Where-Object {
                  -not [string]::IsNullOrWhiteSpace($_) -and
                  (Test-Path -LiteralPath $_)
              } |
              Select-Object -First 1

          if (-not $iscc) {
              throw "Inno Setup compiler was not found on the runner."
          }

          "ISCC_PATH=$iscc" >> $env:GITHUB_ENV

          Write-Host "Inno Setup compiler: $iscc"

      - name: Compile installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force |
              Out-Null

          & $env:ISCC_PATH `
              "/DAppVersion=$env:APP_VERSION" `
              "installer\CK3WorkshopAutoUpdater.iss"

          if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup compilation failed: $LASTEXITCODE"
          }

      - name: Create SHA-256 file
        shell: pwsh
        run: |
          $setupFiles = @(
              Get-ChildItem `
                  -LiteralPath "dist" `
                  -Filter "*.exe" `
                  -File
          )

          if ($setupFiles.Count -ne 1) {
              throw "Expected exactly one setup EXE, found $($setupFiles.Count)."
          }

          $setupFile = $setupFiles[0]

          $hash = (
              Get-FileHash `
                  -LiteralPath $setupFile.FullName `
                  -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          $hashPath = [System.IO.Path]::ChangeExtension(
              $setupFile.FullName,
              ".sha256"
          )

          "$hash  $($setupFile.Name)" |
              Set-Content `
                  -LiteralPath $hashPath `
                  -Encoding ASCII

          Write-Host "Setup: $($setupFile.Name)"
          Write-Host "SHA-256: $hash"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ck3-workshop-auto-updater-installer-v${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
